name: iOS CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'KChime/**'
      - 'KChimeKeyboard/**'
      - 'KChimeShare/**'
      - 'KChimeTests/**'
      - 'Shared/**'
      - 'project.yml'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'KChime/**'
      - 'KChimeKeyboard/**'
      - 'KChimeShare/**'
      - 'KChimeTests/**'
      - 'Shared/**'
      - 'project.yml'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (iOS 17)
    runs-on: macos-14          # Xcode 16 pre-installed
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Resolve Swift packages cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -scheme KChime \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            build | xcpretty

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -scheme KChimeTests \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            test | xcpretty

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 7
