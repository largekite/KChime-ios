name: KChime
options:
  bundleIdPrefix: com.kchime
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: "XXXXXXXXXX"  # Replace with your 10-character Team ID
    CODE_SIGN_STYLE: Automatic

configs:
  Debug: debug
  Release: release

packages:
  KeychainSwift:
    url: https://github.com/evgenyneu/keychain-swift
    from: 20.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0

targets:
  # ─── Main App ────────────────────────────────────────────────────────────────
  KChime:
    type: application
    platform: iOS
    sources:
      - path: KChime
      - path: Shared
    resources:
      - KChime/Resources
    entitlements:
      path: KChime/Resources/KChime.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kchime.app
        INFOPLIST_FILE: KChime/Resources/Info.plist
        APP_GROUP_ID: group.com.kchime.shared
    dependencies:
      - package: KeychainSwift
      - package: RevenueCat
        product: RevenueCat
      - sdk: Speech.framework

  # ─── Keyboard Extension ──────────────────────────────────────────────────────
  KChimeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: KChimeKeyboard
      - path: Shared
    entitlements:
      path: KChimeKeyboard/KChimeKeyboard.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kchime.app.keyboard
        INFOPLIST_FILE: KChimeKeyboard/Info.plist
        APP_GROUP_ID: group.com.kchime.shared
    dependencies:
      - target: KChime
        embed: false
      - package: KeychainSwift

  # ─── Share Extension ─────────────────────────────────────────────────────────
  KChimeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: KChimeShare
      - path: Shared
    entitlements:
      path: KChimeShare/KChimeShare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kchime.app.share
        INFOPLIST_FILE: KChimeShare/Info.plist
        APP_GROUP_ID: group.com.kchime.shared
    dependencies:
      - target: KChime
        embed: false
      - package: KeychainSwift

  # ─── Tests ───────────────────────────────────────────────────────────────────
  KChimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KChimeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kchime.tests
    dependencies:
      - target: KChime
